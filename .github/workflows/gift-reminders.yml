name: Gift exchange reminders

# Once a day, asks the site to send any "one week to go" reminder emails.
# The site decides who is due; each exchange gets its reminder only once.
on:
  schedule:
    - cron: '17 16 * * *' # 16:17 UTC: morning in the US
  workflow_dispatch:

permissions: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the site to send due reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set in this repository's Actions secrets; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            https://timdayley.com/api/gifts/reminders
